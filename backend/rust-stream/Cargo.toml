[package]
name = "rust-stream"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
solana-client = "1.18"
solana-sdk = "1.18"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
reqwest = { version = "0.11", features = ["json"] }